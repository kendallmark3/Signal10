<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Signal10</title>
<style>
  :root { --bg: #f6f5f1; --surface: #ffffff; --text: #1b1c1f; --muted: #62656d; --line: #e2e0d9; --accent: #c2410c; --on-accent: #fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141518; --surface: #1d1f23; --text: #ecebe7; --muted: #9a9da6; --line: #2d3036; --accent: #fb8a4c; --on-accent: #1b1c1f; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  form { width: min(360px, 100%); padding: 28px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; display: grid; gap: 14px; }
  h1 { margin: 0; }
  .logo { display: block; width: 100%; max-width: 100%; height: auto; }
  @media (prefers-color-scheme: dark) { .logo { padding: 10px 14px; background: #faf9f6; border-radius: 12px; } }
  p { margin: 0; color: var(--muted); font-size: 0.9rem; }
  .message { color: var(--accent); font-weight: 600; }
  .message:empty { display: none; }
  label { display: grid; gap: 4px; font-size: 0.875rem; color: var(--muted); }
  input { padding: 11px 12px; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
  button { padding: 12px; font: inherit; font-weight: 600; cursor: pointer; border: 0; border-radius: 10px; background: var(--accent); color: var(--on-accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1><img class="logo" src="<!--logo-->" alt="Signal10" width="1200" height="335"></h1>
  <p>Sign in to continue.</p>
  <p class="message" role="alert"><!--message--></p>
  <label>Username
    <input type="text" name="username" autocomplete="username" autocapitalize="none" required autofocus>
  </label>
  <label>Password
    <input type="password" name="password" autocomplete="current-password" required>
  </label>
  <button type="submit">Sign in</button>
</form>
</body>
</html>
