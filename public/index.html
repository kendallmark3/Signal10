<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal10</title>
<style>
  :root {
    --bg: #f6f5f1; --surface: #ffffff; --text: #1b1c1f; --muted: #62656d; --line: #e2e0d9;
    --accent: #c2410c; --accent-soft: #fdeee4; --bar: #d9d6cc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141518; --surface: #1d1f23; --text: #ecebe7; --muted: #9a9da6; --line: #2d3036;
      --accent: #fb8a4c; --accent-soft: #33221a; --bar: #3a3d44;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 860px; margin: 0 auto; padding: 48px 16px 80px; }
  h1 { margin: 0; flex: 0 1 400px; min-width: 0; }
  /* The width and height attributes carry the real proportions, so the logo scales without skewing. */
  .logo { display: block; box-sizing: border-box; width: 100%; max-width: 100%; height: auto; }
  /* The lettering is dark on a transparent background, so the dark theme gives it a light plate. */
  @media (prefers-color-scheme: dark) { .logo { padding: 10px 14px; background: #faf9f6; border-radius: 12px; } }
  .tagline { margin: 4px 0 24px; color: var(--muted); }
  #search { display: flex; gap: 8px; }
  input[type="text"] {
    flex: 1; min-width: 0; padding: 12px 14px; font: inherit; color: inherit;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  }
  button {
    font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface); color: inherit;
  }
  button[type="submit"] {
    padding: 12px 20px; font-weight: 600; background: var(--accent); border-color: var(--accent); color: #fff;
  }
  @media (prefers-color-scheme: dark) { button[type="submit"] { color: #1b1c1f; } }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .top button[type="submit"] { white-space: nowrap; padding: 4px 12px; font-size: 0.85rem; font-weight: 400; color: var(--muted); background: var(--surface); border-color: var(--line); }
  button:disabled { opacity: 0.6; cursor: progress; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }
  .examples button { padding: 4px 12px; font-size: 0.85rem; color: var(--muted); border-radius: 999px; }
  #status { margin: 32px 0 16px; color: var(--muted); min-height: 1.5em; }
  #status.error { color: var(--accent); }
  .view-switch { display: flex; gap: 8px; margin: 16px 0; }
  .view-switch[hidden] { display: none; }
  .view-switch button { padding: 8px 12px; }
  .view-switch button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  #results { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  #results[hidden] { display: none; }
  #results li {
    display: grid; grid-template-columns: 2.5rem 200px 1fr; gap: 16px; padding: 16px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  }
  .rank { font-size: 1.7rem; font-weight: 700; color: var(--accent); line-height: 1.1; font-variant-numeric: tabular-nums; }
  .thumb { position: relative; display: block; align-self: start; }
  .thumb img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px; background: var(--bar); }
  .thumb span {
    position: absolute; right: 6px; bottom: 6px; padding: 1px 6px; border-radius: 4px;
    background: rgba(0, 0, 0, 0.8); color: #fff; font-size: 0.75rem; font-variant-numeric: tabular-nums;
  }
  .body { min-width: 0; }
  .title { display: block; font-weight: 600; font-size: 1.05rem; line-height: 1.3; color: inherit; text-decoration: none; overflow-wrap: anywhere; }
  .title:hover { text-decoration: underline; }
  .meta { margin: 4px 0 10px; color: var(--muted); font-size: 0.875rem; overflow-wrap: anywhere; }
  .why { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 6px; }
  .headline { padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 0.8rem; font-weight: 600; }
  .score, .views-rank { color: var(--muted); font-size: 0.8rem; }
  .reason { margin: 0 0 12px; }
  .signals { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 0; }
  .signals[hidden] { display: none; }
  .signals div { min-width: 0; }
  .signals dt { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .signals dd { margin: 4px 0 0; height: 5px; border-radius: 3px; background: var(--bar); overflow: hidden; }
  .signals i { display: block; height: 100%; background: var(--accent); }
  dialog {
    width: min(960px, calc(100vw - 32px)); padding: 0; border: 1px solid var(--line); border-radius: 14px;
    background: var(--surface); color: var(--text); overflow: hidden;
  }
  dialog::backdrop { background: rgba(0, 0, 0, 0.75); }
  .player-bar { display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px; }
  .player-bar h2 { flex: 1; min-width: 0; margin: 0; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-bar a { color: var(--accent); font-size: 0.875rem; white-space: nowrap; }
  .player-bar button { padding: 4px 12px; }
  #player-frame { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; background: #000; }
  #architect { display: grid; gap: 12px; }
  #architect[hidden] { display: none; }
  .arch-block { padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
  .arch-block h2 { margin: 0 0 8px; font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .arch-block p { margin: 0; }
  .arch-block ul, .arch-block ol { margin: 0; padding-left: 1.3rem; display: grid; gap: 8px; }
  .arch-block ol > li::marker { color: var(--accent); font-weight: 700; }
  .arch-loading { display: flex; align-items: center; gap: 16px; }
  .arch-loading p { color: var(--muted); font-size: 0.9rem; }
  .spinner {
    flex: none; width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid var(--bar); border-top-color: var(--accent); animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
  .arch-summary { font-size: 1.05rem; }
  .arch-video { font-weight: 600; color: inherit; text-decoration: none; overflow-wrap: anywhere; }
  .arch-video:hover { text-decoration: underline; }
  .arch-meta { display: block; color: var(--muted); font-size: 0.85rem; }
  .arch-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .arch-pair { grid-template-columns: 1fr; } }
  footer { margin-top: 32px; color: var(--muted); font-size: 0.85rem; }
  @media (max-width: 640px) {
    main { padding-top: 28px; }
    #search { flex-direction: column; }
    #results li { grid-template-columns: 2rem 1fr; }
    .thumb { grid-column: 2; }
    .body { grid-column: 1 / -1; }
    .signals { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1><img class="logo" src="/logo.webp" alt="Signal10" width="1200" height="335"></h1>
    <form method="post" action="/logout"><button type="submit">Sign out</button></form>
  </div>
  <p class="tagline">The 10 YouTube videos most worth watching for a topic, not just the 10 most viewed.</p>

  <form id="search">
    <input type="text" id="topic" name="topic" maxlength="120" required
           placeholder="What do you want to learn?" aria-label="Topic or learning goal" autofocus>
    <button type="submit" id="go">Find the Top 10</button>
  </form>
  <div class="examples" id="examples" aria-label="Example topics"></div>

  <p id="status" role="status" aria-live="polite"></p>
  <div class="view-switch" id="view-switch" hidden>
    <button type="button" id="show-top10" aria-pressed="true">Top 10 ranking</button>
    <button type="button" id="show-path" aria-pressed="false">Build Learning Path</button>
    <button type="button" id="show-architect" aria-pressed="false">Architect View</button>
  </div>
  <ol id="results"></ol>
  <section id="architect" aria-label="Architect View" hidden></section>

  <footer id="footer" hidden>
    Ranked on topic match, views per day since posting, depth, freshness and channel standing.
    Every title, count and date comes from YouTube.
  </footer>
</main>

<dialog id="player" aria-labelledby="player-title">
  <div class="player-bar">
    <h2 id="player-title"></h2>
    <a id="player-link" target="_blank" rel="noopener">Open on YouTube</a>
    <button type="button" id="player-close">Close</button>
  </div>
  <iframe id="player-frame" title="Video player" allowfullscreen
          allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
          referrerpolicy="strict-origin-when-cross-origin"></iframe>
</dialog>

<script>
const EXAMPLES = ['Claude Certified Architect Foundations', 'AWS AgentCore', 'Test-Driven Development with AI', 'Learn Python', 'Retirement investing', 'Mapbox development'];
const SIGNALS = [['relevance', 'Topic match'], ['momentum', 'Momentum'], ['depth', 'Depth'], ['recency', 'Freshness'], ['authority', 'Channel']];

const form = document.getElementById('search');
const input = document.getElementById('topic');
const go = document.getElementById('go');
const status = document.getElementById('status');
const list = document.getElementById('results');
const footer = document.getElementById('footer');
const viewSwitch = document.getElementById('view-switch');
const top10Button = document.getElementById('show-top10');
const pathButton = document.getElementById('show-path');
const architectButton = document.getElementById('show-architect');
const architectPanel = document.getElementById('architect');
let searchResults = null;
let architectResult = null; // { view } for the current search, once it has arrived
let architectRequest = null; // the request in flight, so a second click does not start another
let architectStartedAt = 0;
let architectTimer = null;
let currentView = 'top10';

// The session can expire while the page is open; send the user to sign in again.
function signedOut(res) {
  if (res.status !== 401) return false;
  location.href = '/login';
  return true;
}

function pressView(view) {
  currentView = view;
  top10Button.setAttribute('aria-pressed', String(view === 'top10'));
  pathButton.setAttribute('aria-pressed', String(view === 'path'));
  architectButton.setAttribute('aria-pressed', String(view === 'architect'));
  list.hidden = view === 'architect';
  architectPanel.hidden = view !== 'architect';
  status.className = '';
  if (view !== 'architect') clearInterval(architectTimer);
}

function el(tag, props = {}, children = []) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}

const player = document.getElementById('player');
const frame = document.getElementById('player-frame');

function play(v) {
  document.getElementById('player-title').textContent = v.title;
  document.getElementById('player-link').href = v.url;
  frame.src = `https://www.youtube-nocookie.com/embed/${encodeURIComponent(v.id)}?autoplay=1&rel=0`;
  player.showModal();
}

// A plain click plays in the modal; modified clicks keep the link's normal behavior.
function playOnClick(v) {
  return (event) => {
    if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || event.button !== 0) return;
    event.preventDefault();
    play(v);
  };
}

player.addEventListener('close', () => { frame.removeAttribute('src'); }); // stops playback
player.addEventListener('click', (event) => { if (event.target === player) player.close(); });
document.getElementById('player-close').addEventListener('click', () => player.close());

function formatDate(v) {
  if (!v.publishedDate) return v.publishedText;
  const date = new Date(`${v.publishedDate}T00:00:00`).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
  return v.publishedText ? `${date} (${v.publishedText.replace(/^(streamed|premiered) /i, '')})` : date;
}

function card(v, total, learningPath = false) {
  const meta = [
    v.channel + (v.verified ? ' ✓' : ''),
    formatDate(v),
    v.views == null ? null : `${v.views.toLocaleString()} views`,
  ].filter(Boolean).join(' · ');

  const link = { href: v.url, target: '_blank', rel: 'noopener', onclick: playOnClick(v) };
  return el('li', {}, [
    el('div', { className: 'rank', textContent: learningPath ? v.step : v.rank, ariaLabel: learningPath ? `Path step ${v.step}` : `Rank ${v.rank}` }),
    el('a', { ...link, className: 'thumb', tabIndex: -1, ariaHidden: 'true' }, [
      el('img', { src: v.thumbnail, alt: '', loading: 'lazy' }),
      el('span', { textContent: v.durationText }),
    ]),
    el('div', { className: 'body' }, [
      el('a', { ...link, className: 'title', textContent: v.title }),
      el('div', { className: 'meta', textContent: meta }),
      el('div', { className: 'why' }, [
        el('span', { className: 'headline', textContent: learningPath ? v.stage : v.headline }),
        ...(!learningPath ? [
          el('span', { className: 'score', textContent: `Signal score ${v.score}` }),
          el('span', { className: 'views-rank', textContent: v.views == null ? '' : `· #${v.rankByViews} of ${total} by views alone` }),
        ] : []),
      ]),
      el('p', { className: 'reason', textContent: learningPath ? v.pathReason : v.reason }),
      el('dl', { className: 'signals', hidden: learningPath }, SIGNALS.map(([key, label]) => {
        const bar = el('i');
        bar.style.width = `${Math.round(v.signals[key] * 100)}%`;
        return el('div', {}, [el('dt', { textContent: label }), el('dd', { title: `${label}: ${Math.round(v.signals[key] * 100)} of 100` }, [bar])]);
      })),
    ]),
  ]);
}

function showView(learningPath) {
  if (!searchResults) return;
  const { topic, results, learningPath: path } = searchResults;
  const videos = learningPath ? path : results;
  pressView(learningPath ? 'path' : 'top10');
  status.textContent = learningPath
    ? `Learning path for “${topic}”, ordered from title cues.`
    : `Top ${results.length} for “${topic}”, chosen from ${searchResults.candidatesOnTopic} on-topic videos.`
      + (results.length < 10 ? ' Fewer than 10 were a good enough match.' : '');
  list.replaceChildren(...videos.map((v) => card(v, results.length, learningPath)));
  footer.textContent = learningPath
    ? 'The path is inferred from wording in video titles; check each video to confirm its contents.'
    : 'Ranked on topic match, views per day since posting, depth, freshness and channel standing. Every title, count and date comes from YouTube.';
  footer.hidden = false;
}

function archBlock(title, children) {
  return el('div', { className: 'arch-block' }, [el('h2', { textContent: title }), ...children]);
}

const archList = (items) => el('ul', {}, items.map((item) => el('li', { textContent: item })));

function archVideos(entries, ordered) {
  return el(ordered ? 'ol' : 'ul', {}, entries.map(({ video, why }) => el('li', {}, [
    el('a', { href: video.url, target: '_blank', rel: 'noopener', className: 'arch-video', textContent: video.title, onclick: playOnClick(video) }),
    el('span', { className: 'arch-meta', textContent: `${video.channel} · ${video.durationText} · #${video.rank} in the Top 10` }),
    el('div', { textContent: why }),
  ])));
}

function renderArchitect(view) {
  const optional = (title, items) => (items.length > 0 ? [archBlock(title, [archList(items)])] : []);
  architectPanel.replaceChildren(
    archBlock('In short', [el('p', { className: 'arch-summary', textContent: view.summary })]),
    archBlock('Watch in this order', [archVideos(view.sequence, true)]),
    el('div', { className: 'arch-pair' }, [
      ...optional('Before you start', view.prerequisites),
      ...optional('Key concepts', view.keyConcepts),
    ]),
    el('div', { className: 'arch-pair' }, [
      ...optional('What it changes architecturally', view.architectureImplications),
      ...optional('Risks, dependencies and tradeoffs', view.risks),
    ]),
    archBlock('Can skip or leave for later', [
      view.skip.length > 0 ? archVideos(view.skip, false) : el('p', { textContent: 'Nothing in the Top 10 overlaps enough to skip.' }),
    ]),
    ...(view.nextStep ? [archBlock('Try next', [el('p', { textContent: view.nextStep })])] : []),
  );
}

function showArchitectLoading() {
  const elapsed = el('span');
  const tick = () => { elapsed.textContent = `${Math.round((Date.now() - architectStartedAt) / 1000)}s elapsed.`; };
  tick();
  clearInterval(architectTimer);
  architectTimer = setInterval(tick, 1000);
  status.textContent = 'Retrieving Architect View…';
  architectPanel.replaceChildren(el('div', { className: 'arch-block arch-loading' }, [
    el('span', { className: 'spinner', ariaHidden: 'true' }),
    el('div', {}, [
      el('strong', { textContent: 'Retrieving Architect View…' }),
      el('p', { textContent: 'Claude is reading the Top 10 and planning a route. This usually takes 15 to 30 seconds. ' }, [elapsed]),
    ]),
  ]));
}

function requestArchitect(topic) {
  architectStartedAt = Date.now();
  return fetch(`/api/architect?topic=${encodeURIComponent(topic)}`)
    .then(async (res) => {
      if (signedOut(res)) return { signedOut: true };
      const data = await res.json();
      return res.ok ? { view: data.view } : { error: data.error };
    })
    .catch(() => ({ error: 'Architect View could not be reached. The Top 10 and learning path are unaffected.' }));
}

async function showArchitect() {
  if (!searchResults) return;
  const search = searchResults;
  pressView('architect');
  footer.hidden = true;

  let result = architectResult;
  if (!result) {
    architectRequest ??= requestArchitect(search.topic);
    showArchitectLoading();
    result = await architectRequest;
    if (searchResults !== search || result.signedOut) return; // a newer search replaced this one
    architectRequest = null;
    if (result.view) architectResult = result; // an error is not kept, so the next click tries again
    if (currentView !== 'architect') return; // the user moved on; the view is kept for later
  }

  clearInterval(architectTimer);
  if (result.error) {
    architectPanel.replaceChildren();
    status.className = 'error';
    status.textContent = result.error;
    return;
  }
  status.textContent = `Architect View for “${search.topic}”.`;
  renderArchitect(result.view);
  footer.textContent = 'Architect View is written by Claude from the titles, channels and lengths of the Top 10 and its own knowledge of the topic. It has not watched the videos.';
  footer.hidden = false;
}

async function run(topic) {
  go.disabled = true;
  status.className = '';
  status.textContent = `Searching YouTube for “${topic}”…`;
  list.replaceChildren();
  viewSwitch.hidden = true;
  footer.hidden = true;
  searchResults = null;
  architectResult = null;
  architectRequest = null;
  architectPanel.replaceChildren();
  pressView('top10');
  try {
    const res = await fetch(`/api/top10?topic=${encodeURIComponent(topic)}`);
    if (signedOut(res)) return;
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    if (data.results.length === 0) {
      status.textContent = `No videos matched “${topic}” closely enough. Try a broader or differently worded topic.`;
      return;
    }
    searchResults = data;
    viewSwitch.hidden = false;
    showView(false);
  } catch (err) {
    status.className = 'error';
    status.textContent = err.message || 'Something went wrong. Try again.';
  } finally {
    go.disabled = false;
  }
}

top10Button.addEventListener('click', () => showView(false));
pathButton.addEventListener('click', () => showView(true));
architectButton.addEventListener('click', showArchitect);

form.addEventListener('submit', (event) => {
  event.preventDefault();
  const topic = input.value.trim();
  if (topic) run(topic);
});

document.getElementById('examples').append(...EXAMPLES.map((topic) => {
  const chip = el('button', { type: 'button', textContent: topic });
  chip.addEventListener('click', () => { input.value = topic; run(topic); });
  return chip;
}));

// Lets a search be opened by link: /?topic=AWS%20AgentCore
const linked = new URLSearchParams(location.search).get('topic')?.trim();
if (linked) { input.value = linked; run(linked); }
</script>
</body>
</html>
