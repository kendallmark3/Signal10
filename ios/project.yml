# Source for Signal10.xcodeproj. The generated project is committed, so building needs only Xcode;
# after changing this file, run `xcodegen` in ios/ and commit the regenerated project.
name: Signal10
options:
  bundleIdPrefix: com.kendallsoft
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 3MA883Y6R4
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Signal10:
    type: application
    platform: iOS
    sources: [Signal10]
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kendallsoft.Signal10
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Signal10/Info.plist
  Signal10Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Signal10Tests
        excludes: [Fixtures]
      - path: Signal10Tests/Fixtures
        buildPhase: resources
        type: folder
    dependencies:
      - target: Signal10
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kendallsoft.Signal10Tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Signal10.app/Signal10
        BUNDLE_LOADER: $(TEST_HOST)
  Signal10UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Signal10UITests]
    dependencies:
      - target: Signal10
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kendallsoft.Signal10UITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Signal10
schemes:
  Signal10:
    build:
      targets:
        Signal10: all
        Signal10Tests: [test]
        Signal10UITests: [test]
    test:
      targets: [Signal10Tests, Signal10UITests]
